<!doctype html>
<html lang="en" class="h-full bg-slate-50 dark:bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grouptly | Online Group & Membership Management Platform</title>
    <meta name="description" content="Streamline member registration, dues tracking, event attendance, and group records with Grouptly." />
    <meta property="og:title" content="Grouptly | Online Group & Membership Management Platform" />
    <meta property="og:description" content="Streamline member registration, dues tracking, event attendance, and group records with Grouptly." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/aistudio/Vibrant_Group_Community_Orbit_Logo_06954778.png" />
    <link rel="apple-touch-icon" href="/assets/aistudio/Vibrant_Group_Community_Orbit_Logo_06954778.png" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('grouptly_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full font-['Plus_Jakarta_Sans',sans-serif] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
